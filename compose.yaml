services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: financial_disclosure
      POSTGRES_USER: financial
      POSTGRES_PASSWORD: financial_local
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial -d financial_disclosure"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - financial-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - financial-redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
      - "9011:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - financial-minio-data:/data

  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/financial_disclosure
      POSTGRES_USER: financial
      POSTGRES_PASSWORD: financial_local
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      FINANCIAL_AGENT_ENABLED: ${FINANCIAL_AGENT_ENABLED:-false}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_CHAT_MODEL: ${QWEN_CHAT_MODEL:-qwen-plus}
      FINANCIAL_SEC_USER_AGENT: ${FINANCIAL_SEC_USER_AGENT:-}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  financial-postgres-data:
  financial-redis-data:
  financial-minio-data:
